<!DOCTYPE html>
<html>
<head>
    <title>RupeyaWise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light p-3">
    <a class="navbar-brand" href="{% url 'expenses:dashboard' %}">RupeyaWise</a>
    <div class="ms-auto d-flex">
        <a href="{% url 'expenses:dashboard' %}" class="btn btn-outline-primary me-2">Dashboard</a>
        <a href="{% url 'expenses:expense_list' %}" class="btn btn-outline-primary me-2">Expenses</a>
        <a href="{% url 'expenses:add_expense' %}" class="btn btn-primary me-2">Add Expense</a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-secondary">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
</body>
</html>
