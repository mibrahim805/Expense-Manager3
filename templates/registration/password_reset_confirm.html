<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password - RupeyaWise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container mt-5" style="max-width: 480px;">
    {% if validlink %}
        <h1 class="h3 mb-3">Choose a new password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100" type="submit">Save new password</button>
        </form>
    {% else %}
        <h1 class="h3">Reset link expired</h1>
        <p>Request a new password reset link to continue.</p>
        <a href="{% url 'password_reset' %}">Request a new link</a>
    {% endif %}
</main>
</body>
</html>
