<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - RupeyaWise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container mt-5" style="max-width: 480px;">
    <h1 class="h3 mb-3">Reset your password</h1>
    <p>Enter the email address linked to your account and we’ll send reset instructions.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100" type="submit">Send reset link</button>
    </form>
</main>
</body>
</html>
