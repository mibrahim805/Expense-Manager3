{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Your Products</h2>

<a href="{% url 'expenses:add_product' %}" class="btn btn-success mb-3">Add Product</a>

<table class="table table-striped table-bordered">
    <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Default Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.description }}</td>
            <td>Rs. {{ product.default_price }}</td>
            <td>
                <a href="{% url 'expenses:update_product' product.id %}" class="btn btn-sm btn-warning">Update</a>
                <a href="{% url 'expenses:delete_product' product.id %}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this product?');">
                   Delete
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center">No products found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
